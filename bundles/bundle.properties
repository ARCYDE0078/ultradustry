ultradustry.welcome.title = Welcome to ULTRAdustry
ultradustry.welcome.text = Thanks for installing ULTRAdustry!\n\nThe music is NOT stored inside the mod (that is why it is so small): the tracks are downloaded from the ULTRAKILL wiki.\n\nOpen Settings -> ULTRAdustry -> "Music pack: download and manage" and download the track groups you want. With automatic download on (the default) the mod also fetches what the current sector needs while you play, but downloading a pack first means the music starts right away.
ultradustry.welcome.open = Open music pack
ultradustry.welcome.ok = Got it

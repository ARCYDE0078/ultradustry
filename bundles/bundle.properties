setting.ultradustry-threat-threshold.name = Threat for combat music
setting.ultradustry-threat-threshold.description = Every enemy unit has threat points by tier: T1 = 1, T2 = 3, T3 = 8, T4 = 25, T5 = 75 (modded units are estimated from health and damage). Combat music starts when the total threat of living enemies reaches this value, no matter how many units there are.
ultradustry.threat.pts = pts
ultradustry.unit.sec = s
ultradustry.unit.ms = ms
setting.ultradustry-wave-switch.name = Switch music on wave start
setting.ultradustry-menu-bg.name = Animated main menu background
setting.ultradustry-menu-unit.name = Unit widget in the standard main menu
setting.ultradustry-term-unit.name = Unit figure in the terminal main menu
setting.ultradustry-menu-terminal.name = Main menu as a terminal (ULTRAKILL style)
setting.ultradustry-menu-terminal.description = Black screen with a frame, diagnostics and big buttons. The STANDARD MENU link in the bottom-right corner switches to the regular Mindustry menu (a TERMINAL link in the top-left corner switches back). Arrow keys, Enter and Esc work too.
setting.ultradustry-menu-holiday.name = Holiday menu music and title screen
setting.ultradustry-menu-holiday.description = Auto: Halloween Oct 25-31, Christmas Dec 22-28, Easter (Friday-Sunday), like ULTRAKILL. The menu music changes when the game starts.
setting.ultradustry-autodl.name = Download music automatically
setting.ultradustry-autodl.description = Downloads what the game needs in the background: the track pair for the current sector, upcoming guardian themes and a few calm tracks. When off, only tracks you downloaded by hand will play.
setting.ultradustry-peace-delay.name = Calm music after no enemies for
setting.ultradustry-boss-lead.name = Guardian intro lead
setting.ultradustry-boss-lead.description = How much earlier than the wave start the guardian intro should end, so the guardian theme is already playing when it appears. Raise it if the intro still ends after the guardian shows up, lower it if the theme starts too early.
setting.ultradustry-musicpack.name = Music pack

ultradustry.pack.title = ULTRAdustry music pack
ultradustry.pack.open = Music pack: download and manage
ultradustry.pack.info = The tracks are not stored inside the mod. They are downloaded from the ULTRAKILL wiki into a folder next to your game data, so the mod stays small and loads fast. Download whole groups here, or just play and let the mod fetch what the current sector needs.
ultradustry.pack.folder = Folder: {0}
ultradustry.pack.manual = Clair de Lune is not on the wiki. Put your own file named peace-clair-de-lune.ogg into the folder above and it joins the calm tracks. Tracks you do not want can simply be deleted from the folder.

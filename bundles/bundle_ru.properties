ultradustry.pack.info = Треки не лежат внутри мода: они скачиваются с вики ULTRAKILL в папку рядом с данными игры, поэтому мод маленький и быстро грузится. Здесь можно скачать группы целиком, а можно просто играть: мод сам докачает то, что нужно текущему сектору.

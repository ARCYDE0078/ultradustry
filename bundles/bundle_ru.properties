setting.ultradustry-threat-threshold.name = Угроза врагов для боевой музыки
setting.ultradustry-threat-threshold.description = У каждого вражеского юнита есть очки угрозы по тиру: Т1 = 1, Т2 = 3, Т3 = 8, Т4 = 25, Т5 = 75 (для юнитов из модов оценивается по здоровью и урону). Боевая музыка включается, когда суммарная угроза живых врагов достигает этого значения, сколько бы юнитов ни было.

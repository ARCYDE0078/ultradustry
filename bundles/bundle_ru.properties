ultradustry.welcome.title = Добро пожаловать в ULTRAdustry
ultradustry.welcome.text = Спасибо, что поставили ULTRAdustry!\n\nМузыка НЕ хранится внутри мода (поэтому он такой лёгкий): треки скачиваются с вики ULTRAKILL.\n\nОткройте Настройки -> ULTRAdustry -> «Набор музыки: скачать и управлять» и скачайте нужные группы треков. При включённой автозагрузке (по умолчанию) мод ещё и сам докачивает нужное для текущего сектора во время игры, но если скачать набор заранее, музыка заиграет сразу.

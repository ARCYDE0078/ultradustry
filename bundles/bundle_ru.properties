setting.ultradustry-wave-switch.name = Менять музыку в начале волны
setting.ultradustry-menu-bg.name = Анимированный фон главного меню
setting.ultradustry-menu-unit.name = Виджет с юнитом в стандартном главном меню
setting.ultradustry-term-unit.name = Фигура юнита в терминальном главном меню
setting.ultradustry-menu-terminal.name = Главное меню в виде терминала (как в ULTRAKILL)
setting.ultradustry-menu-terminal.description = Чёрный экран с рамкой, диагностикой и крупными кнопками. Ссылка «СТАНДАРТНОЕ МЕНЮ» в правом нижнем углу возвращает обычное меню Mindustry (со ссылкой «ТЕРМИНАЛ» в левом верхнем углу — обратно). Ссылки на Discord/GitHub/вики внизу слева, стрелки, Enter и Esc тоже работают.
setting.ultradustry-menu-holiday.name = Праздничная музыка и заставка меню
setting.ultradustry-menu-holiday.description = «По дате»: Хэллоуин 25-31 октября, Рождество 22-28 декабря, Пасха (пятница-воскресенье) — как в ULTRAKILL. Музыка меню меняется при запуске игры.
setting.ultradustry-autodl.name = Скачивать музыку автоматически
setting.ultradustry-autodl.description = Докачивает нужное в фоне: пару треков текущего сектора, темы ближайших стражей и несколько спокойных треков. Если выключить, играют только треки, скачанные вручную.
setting.ultradustry-peace-delay.name = Спокойная музыка, если врагов нет
setting.ultradustry-boss-lead.name = Опережение интро стража
setting.ultradustry-boss-lead.description = Насколько раньше волны со стражем должно кончиться его интро, чтобы тема стража уже играла, когда он появляется. Если интро всё равно заканчивается позже появления стража — увеличьте, если тема стражу слишком рано — уменьшите.
setting.ultradustry-musicpack.name = Набор музыки

